name: Release desktop builds

# Builds Windows, macOS, and Linux installers, each on its own native
# runner - AppImage (Linux) and dmg/pkg signing (Mac) tooling genuinely
# cannot run cross-platform (confirmed: mksquashfs is a Linux ELF binary,
# codesign/hdiutil are macOS-only), so this replaces trying to cross-build
# everything from one machine.
#
# One-time setup required (repo owner):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: YTPD_WEB_PAT
#   Value: a fine-grained PAT with read-only "Contents" access to the
#   private anonymous020786-dotcom/ytpd-web repo (this workflow checks it
#   out as a sibling directory, since that's where backend/frontend live).
#
# Triggers on pushing a tag like v1.2.3 (builds + publishes a release), or
# manually via the Actions tab (builds only; installers are attached to the
# workflow run as artifacts instead of being published).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Creates the GitHub release once, before any platform build starts.
  # Without this, all 3 matrix jobs below run `electron-builder --publish
  # always` in parallel, each independently checking "does a release for
  # this tag exist yet?" - and when none does, more than one job can win
  # that race and create its own release object, splitting the uploaded
  # assets across duplicates (hit this for real on v1.0.3: the macOS job's
  # assets landed on a separate release from Windows/Linux's). Creating it
  # up front means every matrix job finds it already there and just
  # uploads to it.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Playlist Grabber ${{ github.ref_name }}" \
            --draft \
            --generate-notes

  build:
    needs: create-release
    # create-release is skipped on a manual (non-tag) run, and a skipped
    # dependency would otherwise skip this job too.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platforms: win
          - os: macos-latest
            platforms: osx-arm64
          - os: ubuntu-latest
            platforms: linux
          # Intel Mac (macos-13, osx-x64) deliberately omitted: tried it once,
          # the job sat queued for 27+ minutes with zero runner ever
          # allocated (GitHub's Intel Mac fleet is being phased out) and had
          # to be cancelled. Build it manually on real Intel hardware if ever
          # needed - see README.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout ytpd-desktop
        uses: actions/checkout@v4
        with:
          path: ytpd-desktop

      - name: Checkout ytpd-web (private, sibling dir)
        uses: actions/checkout@v4
        with:
          repository: anonymous020786-dotcom/ytpd-web
          token: ${{ secrets.YTPD_WEB_PAT }}
          path: ytpd-web

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A *static* ffmpeg is required: it's copied into the app on its own,
      # so a package-manager build (choco's shim exe, or brew/apt's
      # dynamically-linked binary) breaks on end users' machines.
      # ffmpeg-static ships static builds for win-x64, linux-x64 and both
      # macOS arches.
      - name: Fetch static ffmpeg
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-static" && cd "$RUNNER_TEMP/ffmpeg-static"
          npm init -y > /dev/null
          npm install --no-audit --no-fund ffmpeg-static@5
          FFMPEG_BIN="$(node -p "require('ffmpeg-static')")"
          test -f "$FFMPEG_BIN" || { echo "::error::ffmpeg-static didn't download its binary"; exit 1; }
          case "${{ matrix.platforms }}" in
            win) VAR=YTPD_FFMPEG_WIN ;;
            linux) VAR=YTPD_FFMPEG_LINUX ;;
            osx-arm64) VAR=YTPD_FFMPEG_OSX_ARM64 ;;
            osx-x64) VAR=YTPD_FFMPEG_OSX_X64 ;;
          esac
          echo "$VAR=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        working-directory: ytpd-desktop
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ytpd-web/frontend
        run: npm ci

      - name: Build TypeScript
        working-directory: ytpd-desktop
        run: npm run build

      - name: Prepare resources (publish backend, build frontend, bundle ffmpeg)
        working-directory: ytpd-desktop
        env:
          YTPD_PLATFORMS: ${{ matrix.platforms }}
          YTPD_WEB_REPO_PATH: ${{ github.workspace }}/ytpd-web
        run: node scripts/prepare-resources.mjs

      # electron-builder uploads to the release named v<package.json
      # version>, not to the pushed tag - a mismatch would silently create a
      # second draft release instead of filling the one made above.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ytpd-desktop
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version $VERSION"
            exit 1
          fi

      - name: Package and publish
        working-directory: ytpd-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Upload build artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: playlist-grabber-${{ matrix.platforms }}
          path: |
            ytpd-desktop/release/*.exe
            ytpd-desktop/release/*.zip
            ytpd-desktop/release/*.AppImage
          if-no-files-found: error

  finalize-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
